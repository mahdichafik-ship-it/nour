[package]
name = "nour-desktop"
version = "0.1.7"
description = "Nour Local Video Studio for macOS"
authors = ["Nour Studio"]
edition = "2021"

[lib]
name = "nour_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
png = "0.17"
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-shell = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
