name: Nour Desktop Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-mac:
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            rust_target: x86_64-apple-darwin
            runner: macos-15-intel
            runner_architecture: x86_64
          - architecture: arm64
            rust_target: aarch64-apple-darwin
            runner: macos-14
            runner_architecture: arm64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify native runner architecture
        env:
          EXPECTED_RUNNER_ARCHITECTURE: ${{ matrix.runner_architecture }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = "$EXPECTED_RUNNER_ARCHITECTURE"

      - name: Verify tag and release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node <<'NODE'
          const fs = require('fs')
          const packageVersion = JSON.parse(
            fs.readFileSync('artifacts/nour-studio/package.json', 'utf8'),
          ).version
          const tauriVersion = JSON.parse(
            fs.readFileSync('artifacts/nour-studio/src-tauri/tauri.conf.json', 'utf8'),
          ).version
          const cargoVersion = fs
            .readFileSync('artifacts/nour-studio/src-tauri/Cargo.toml', 'utf8')
            .match(/^version\\s*=\\s*"([^"]+)"/m)?.[1]
          const expected = `v${packageVersion}`
          if (process.env.RELEASE_TAG !== expected) {
            throw new Error(`Release tag ${process.env.RELEASE_TAG} must equal ${expected}`)
          }
          if (tauriVersion !== packageVersion || cargoVersion !== packageVersion) {
            throw new Error(
              `Version mismatch: package=${packageVersion}, tauri=${tauriVersion}, cargo=${cargoVersion}`,
            )
          }
          NODE

      - name: Verify signing, notarization, and updater secrets
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          missing=()
          for name in \
            APPLE_CERTIFICATE \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_SIGNING_IDENTITY \
            APPLE_ID \
            APPLE_PASSWORD \
            APPLE_TEAM_ID \
            TAURI_SIGNING_PRIVATE_KEY \
            TAURI_SIGNING_PRIVATE_KEY_PASSWORD \
            TAURI_UPDATER_PUBLIC_KEY
          do
            if [ -z "${!name:-}" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing release secrets: ${missing[*]}"
            exit 1
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Prepare GitHub updater configuration
        working-directory: artifacts/nour-studio
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
        run: pnpm run desktop:prepare-release

      - name: Build, sign, notarize, and bundle
        working-directory: artifacts/nour-studio
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          pnpm exec tauri build \
            --target "${{ matrix.rust_target }}" \
            --bundles app,dmg

      - name: Stage architecture-specific release assets
        working-directory: artifacts/nour-studio
        run: |
          pnpm run desktop:stage-release -- \
            "${{ matrix.rust_target }}" \
            "${{ matrix.architecture }}" \
            "$RUNNER_TEMP/nour-release"

      - name: Verify signed and notarized DMG
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          dmg="$RUNNER_TEMP/nour-release/Nour-${version}-${ARCHITECTURE}.dmg"
          mount_dir="$(mktemp -d)"
          hdiutil attach "$dmg" -readonly -nobrowse -mountpoint "$mount_dir"
          app_path="$(find "$mount_dir" -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$app_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          spctl --assess --type execute --verbose=2 "$app_path"
          xcrun stapler validate "$app_path"
          hdiutil detach "$mount_dir"

      - name: Upload verified architecture
        uses: actions/upload-artifact@v4
        with:
          name: nour-desktop-mac-${{ matrix.architecture }}
          if-no-files-found: error
          path: ${{ runner.temp }}/nour-release/*

  combine-mac:
    needs: build-mac
    runs-on: ubuntu-latest
    steps:
      - name: Checkout updater tools
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Download native macOS packages
        uses: actions/download-artifact@v4
        with:
          pattern: nour-desktop-mac-*
          merge-multiple: true
          path: release

      - name: Generate and validate Tauri updater metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          pnpm --dir artifacts/nour-studio run desktop:merge-updater -- \
            "$GITHUB_WORKSPACE/release" "$version"
          pnpm --dir artifacts/nour-studio run desktop:validate-updater -- \
            "$GITHUB_WORKSPACE/release" "$version"

      - name: Stage complete release
        uses: actions/upload-artifact@v4
        with:
          name: nour-desktop-release
          if-no-files-found: error
          path: release/*

  publish-release:
    needs: combine-mac
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified release
        uses: actions/download-artifact@v4
        with:
          name: nour-desktop-release
          path: release

      - name: Upload complete release as draft
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          draft: true
          files: release/*

      - name: Verify uploaded assets and publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          expected="$(find release -maxdepth 1 -type f -printf '%f\n' | sort)"
          uploaded="$(gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json assets \
            --jq '.assets[].name' | sort)"
          test "$uploaded" = "$expected"
          gh release edit "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            --latest