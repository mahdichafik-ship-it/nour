name: Nour Desktop Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install signing tools without compiling native apps
        run: pnpm install --no-frozen-lockfile

      - name: Verify updater key pair and Apple notarization credentials
        working-directory: artifacts/nour-studio
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
        run: node scripts/preflight-release.mjs

  build-mac:
    needs: preflight
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            rust_target: x86_64-apple-darwin
            runner: macos-15-intel
            runner_architecture: x86_64
          - architecture: arm64
            rust_target: aarch64-apple-darwin
            runner: macos-14
            runner_architecture: arm64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify native runner architecture
        env:
          EXPECTED_RUNNER_ARCHITECTURE: ${{ matrix.runner_architecture }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = "$EXPECTED_RUNNER_ARCHITECTURE"

      - name: Verify tag and release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node <<'NODE'
          const fs = require('fs')
          const packageVersion = JSON.parse(
            fs.readFileSync('artifacts/nour-studio/package.json', 'utf8'),
          ).version
          const tauriVersion = JSON.parse(
            fs.readFileSync('artifacts/nour-studio/src-tauri/tauri.conf.json', 'utf8'),
          ).version
          const cargoVersion = fs
            .readFileSync('artifacts/nour-studio/src-tauri/Cargo.toml', 'utf8')
            .match(/^version\s*=\s*"([^"]+)"/m)?.[1]
          const expected = `v${packageVersion}`
          if (process.env.RELEASE_TAG !== expected) {
            throw new Error(`Release tag ${process.env.RELEASE_TAG} must equal ${expected}`)
          }
          if (tauriVersion !== packageVersion || cargoVersion !== packageVersion) {
            throw new Error(
              `Version mismatch: package=${packageVersion}, tauri=${tauriVersion}, cargo=${cargoVersion}`,
            )
          }
          NODE

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Prepare GitHub updater configuration
        working-directory: artifacts/nour-studio
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
        run: pnpm run desktop:prepare-release

      - name: Generate valid native icons from the source artwork
        working-directory: artifacts/nour-studio
        run: node scripts/generate-desktop-icons.mjs

      - name: Build, sign, notarize, and bundle
        working-directory: artifacts/nour-studio
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          pnpm exec tauri build \
            --target "${{ matrix.rust_target }}" \
            --bundles app,dmg

      - name: Stage architecture-specific release assets
        working-directory: artifacts/nour-studio
        run: |
          pnpm run desktop:stage-release \
            "${{ matrix.rust_target }}" \
            "${{ matrix.architecture }}" \
            "$RUNNER_TEMP/nour-release"

      - name: Verify signed and notarized DMG
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          dmg="$RUNNER_TEMP/nour-release/Nour-${version}-${ARCHITECTURE}.dmg"
          mount_dir="$(mktemp -d)"
          hdiutil attach "$dmg" -readonly -nobrowse -mountpoint "$mount_dir"
          trap 'hdiutil detach "$mount_dir" >/dev/null 2>&1 || true' EXIT
          app_path="$(find "$mount_dir" -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$app_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          spctl --assess --type execute --verbose=2 "$app_path"
          xcrun stapler validate "$app_path"
          # Signing checks cannot detect application startup panics.
          # Run the actual bundled executable on each native Mac runner.
          startup_log="$RUNNER_TEMP/nour-startup-${ARCHITECTURE}.log"
          "$app_path/Contents/MacOS/nour-desktop" >"$startup_log" 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true; hdiutil detach "$mount_dir" >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 20); do
            sleep 1
            if ! kill -0 "$app_pid" 2>/dev/null; then
              cat "$startup_log"
              echo "Nour exited during the native startup smoke test."
              exit 1
            fi
          done
          if grep -Eiq 'panicked at|Failed to setup app|invalid icon' "$startup_log"; then
            cat "$startup_log"
            exit 1
          fi
          kill "$app_pid"
          wait "$app_pid" 2>/dev/null || true
          hdiutil detach "$mount_dir"
          trap - EXIT

      - name: Upload verified architecture
        uses: actions/upload-artifact@v4
        with:
          name: nour-desktop-mac-${{ matrix.architecture }}
          if-no-files-found: error
          path: ${{ runner.temp }}/nour-release/*

  combine-mac:
    needs: build-mac
    runs-on: ubuntu-latest
    steps:
      - name: Checkout updater tools
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Download native macOS packages
        uses: actions/download-artifact@v4
        with:
          pattern: nour-desktop-mac-*
          merge-multiple: true
          path: release

      - name: Generate and validate Tauri updater metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          pnpm --dir artifacts/nour-studio run desktop:merge-updater \
            "$GITHUB_WORKSPACE/release" "$version"
          pnpm --dir artifacts/nour-studio run desktop:validate-updater \
            "$GITHUB_WORKSPACE/release" "$version"

      - name: Stage complete release
        uses: actions/upload-artifact@v4
        with:
          name: nour-desktop-release
          if-no-files-found: error
          path: release/*

  draft-release:
    needs: combine-mac
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified release
        uses: actions/download-artifact@v4
        with:
          name: nour-desktop-release
          path: release

      - name: Upload complete release as draft
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          draft: true
          files: release/*

      - name: Verify uploaded draft assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          expected="$(find release -maxdepth 1 -type f -printf '%f\n' | sort)"
          uploaded="$(gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json assets \
            --jq '.assets[].name' | sort)"
          test "$uploaded" = "$expected"

  test-native-update:
    needs: [combine-mac, draft-release]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            runner: macos-15-intel
            runner_architecture: x86_64
          - architecture: arm64
            runner: macos-14
            runner_architecture: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - name: Checkout updater test harness
        uses: actions/checkout@v4

      - name: Verify native runner architecture
        env:
          EXPECTED_RUNNER_ARCHITECTURE: ${{ matrix.runner_architecture }}
        run: test "$(uname -m)" = "$EXPECTED_RUNNER_ARCHITECTURE"

      - name: Download signed draft candidate
        uses: actions/download-artifact@v4
        with:
          name: nour-desktop-release
          path: release

      - name: Install previous version and complete a real update
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          chmod +x artifacts/nour-studio/scripts/test-macos-updater.sh
          artifacts/nour-studio/scripts/test-macos-updater.sh \
            "${{ matrix.architecture }}" \
            "$GITHUB_WORKSPACE/release" \
            "${RELEASE_VERSION#v}"

  publish-release:
    needs: test-native-update
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish update-tested release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release edit "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            --latest
